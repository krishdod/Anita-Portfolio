    <script>
      // Apply the saved theme before the first paint, including restricted-storage browsers.
      try {
        var savedTheme = localStorage.getItem('theme');
        var darkTheme = savedTheme === 'dark' || (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', darkTheme);
        document.documentElement.style.colorScheme = darkTheme ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', darkTheme ? '#130f1a' : '#f4f7fa');
      } catch (_) {
        document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches);
      }
    </script>
